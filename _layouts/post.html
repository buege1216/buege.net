---
layout: default
---
<article>
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.author %} · {{ page.author }}{% endif %}</div>
  </header>
  <div class="article-body">
    {{ content }}
  </div>
</article>
<div class="back-link"><a href="{{ '/' | relative_url }}">← 回到文章列表</a></div>
