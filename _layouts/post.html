---
layout: default
---
<article>
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="meta">{{ page.date | date_to_xmlschema | slice: 0, 10 }}{% if page.author %} · {{ page.author }}{% endif %}{% if page.updated %} · 最後編輯 {{ page.updated | date: "%Y-%m-%d %H:%M" }}{% endif %}</div>
  </header>
  <div class="article-body">
    {{ content }}
  </div>
</article>
<div class="back-link"><a href="{{ '/' | relative_url }}">← 回到文章列表</a></div>
