---
layout: default
---
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a class="post-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <div class="meta">{{ post.date | date: "%Y-%m-%d" }}</div>
    {% if post.excerpt %}<p class="excerpt">{{ post.excerpt | strip_html | truncate: 90 }}</p>{% endif %}
  </li>
  {% else %}
  <li class="meta">還沒有文章。</li>
  {% endfor %}
</ul>
