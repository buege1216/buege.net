# Pages CMS 後台設定（app.pagescms.org，用 GitHub 登入）
media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: 文章
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{url_name}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: updated
        label: 最後編輯時間
        type: date
        readonly: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xxx"
      - name: date
        label: 發布時間
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xxx"
      - name: url_name
        label: 網址名稱
        type: string
        required: true
      - name: author
        label: 作者
        type: select
        required: true
        options:
          values:
            - Buege
            - 言熙
      - name: body
        label: 內文
        type: rich-text
        options:
          format: html
