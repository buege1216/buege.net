# 文章被修改（不是新增）時，自動在 front matter 寫入 updated: 最後編輯時間
name: stamp-updated
on:
  push:
    branches: [main]
    paths: ['_posts/**']
permissions:
  contents: write
jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stamp updated time
        run: |
          now=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S +08:00')
          files=$(git diff --name-only --diff-filter=M HEAD^ HEAD -- '_posts/*.md' || true)
          [ -z "$files" ] && exit 0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -q '^updated:' "$f"; then
              sed -i "s|^updated:.*|updated: $now|" "$f"
            else
              sed -i "0,/^date:.*/s||&\nupdated: $now|" "$f"
            fi
          done <<< "$files"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Stamp updated time"
          git push
